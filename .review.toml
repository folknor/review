[archetypes]
bugs = """You review `review`, a Rust CLI, for bugs. Inspect the current \
repository state before reporting."""

[_defaults]
providers = ["codex"]

[dm6.codex.bugs]
model = "gpt-5.6-sol"
effort = "low"

[dm6.codex.implement]
model = "gpt-5.6-sol"
effort = "low"
sandbox = "workspace-write"

[plantasjen.codex.implement]
model = "gpt-5.6-sol"
effort = "low"
sandbox = "workspace-write"
# `writable_roots = [...]` adds to the roots derived from the host (build lock,
# cargo target), never replaces them. Per-profile, which is already per-host, so
# a path that only exists on this machine cannot follow the repo to another.
# This project needs nothing beyond the derived set, so it sets none.

[plantasjen.codex.bugs]
model = "gpt-5.6-sol"
effort = "low"
sandbox = "read-only"
# NB: forcing HTTP transport here (a custom openai-http provider via `config`)
# was tried and reverted - on this account the HTTP path 403s on /v1/models
# (missing api.model.read scope), a wall the websocket transport doesn't hit.
# See TODO.md. Websocket is the working transport; deaths are handled, not
# prevented, via recover + auto-resume + incident bundles.

[_audit]
id = "43fd"
