[plantasjen.codex.implement]
model = "gpt-5.6-sol"
effort = "low"
sandbox = "workspace-write"
# `writable_roots = [...]` adds to the roots derived from the host (build lock,
# cargo target), never replaces them. Per-profile, which is already per-host, so
# a path that only exists on this machine cannot follow the repo to another.
# Entries may use `~`, `$VAR` and `${VAR}`, which is what makes one file work
# across hosts with different layouts.
#
# `~/.cache/brokkr` is brokkr's lock directory when `XDG_RUNTIME_DIR` is unset,
# which is the case whenever `review` is launched from an agent harness that
# strips it. It is declared here rather than derived because it is a fact about
# this profile's workflow (an agent that runs brokkr), not about the machine,
# and because it is brokkr's private fallback: derivation would have `review`
# predicting the internals of a tool it neither selects nor invokes, and going
# silently stale on the next brokkr release. Without it every build in this
# profile dies at `lock: failed to open lock file: Read-only file system`
# before compiling anything.
writable_roots = ["~/.cache/brokkr"]

[plantasjen.codex.bugs]
model = "gpt-5.6-sol"
effort = "low"
sandbox = "read-only"
